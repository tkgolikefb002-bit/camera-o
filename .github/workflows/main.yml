name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Tải mã nguồn từ repository xuống
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Cài đặt môi trường Java (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Tự động tải tệp gradle-wrapper.jar còn thiếu và cấp quyền chạy cho gradlew
    - name: Auto Setup Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.4.0/subprojects/wrapper/src/unshaded/resources/gradle-wrapper.jar
        chmod +x gradlew

    # 4. Tiến hành build tệp APK bản Debug
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 5. Lưu tệp APK sau khi build thành công
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
