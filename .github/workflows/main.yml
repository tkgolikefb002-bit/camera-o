name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Tải mã nguồn từ repository xuống
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Cài đặt môi trường Java (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Tự động thiết lập Gradle Wrapper sạch sẽ (tải cả jar và tạo lại gradlew chuẩn Linux)
    - name: Setup Gradle Wrapper Properly
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.4.0/subprojects/wrapper/src/unshaded/resources/gradle-wrapper.jar
        
        # Tự tạo lại tệp gradlew chuẩn định dạng Linux (LF) trực tiếp tại đây
        cat << 'EOF' > gradlew
        #!/usr/bin/env sh
        DEFAULT_JVM_OPTS=""
        JAVACMD="java"
        app_name="Gradle"
        app_command="gradlew"
        
        # Attempt to set APP_HOME
        PRG="$0"
        while [ -h "$PRG" ] ; do
            ls=`ls -ld "$PRG"`
            link=`expr "$ls" : '.*-> \(.*\)$'`
            expr "$link" : '/.*' > /dev/null || link=`dirname "$PRG"`/"$link"
            PRG="$link"
        st done 2>/dev/null || true
        done
        
        SAVED="`pwd`"
        cd "`dirname "$PRG"`" >/dev/null
        APP_HOME="`pwd -P`"
        cd "$SAVED" >/dev/null
        
        CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
        
        exec "$JAVACMD" \
            -classpath "$CLASSPATH" \
            org.gradle.wrapper.GradleWrapperMain "$@"
        EOF

        chmod +x gradlew

    # 4. Tiến hành build tệp APK bản Debug
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 5. Lưu tệp APK sau khi build thành công
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
