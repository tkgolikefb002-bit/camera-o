name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Tải mã nguồn từ repository xuống máy chủ ảo GitHub Actions
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Cài đặt môi trường Java (JDK 17 tiêu chuẩn cho Android hiện đại)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Cấp quyền chạy cho tập lệnh Gradle wrapper
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Tiến hành build tệp APK bản Debug
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 5. Lưu tệp APK sau khi build thành Artifact để có thể tải về
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
