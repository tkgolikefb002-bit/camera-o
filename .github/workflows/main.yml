name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Tải mã nguồn từ repository xuống
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Cài đặt môi trường Java (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Tự động tải và cài đặt trực tiếp Gradle phiên bản 8.4
    - name: Install Gradle Directly
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
        unzip -q gradle-8.4-bin.zip
        echo "$PWD/gradle-8.4/bin" >> $GITHUB_PATH

    # 4. Tiến hành build tệp APK bản Debug trực tiếp bằng lệnh gradle
    - name: Build Debug APK
      run: gradle assembleDebug

    # 5. Lưu tệp APK sau khi build thành công thành Artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
